<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="WC Hunter — No busques un WC. Busca un WC que quieras usar. La mayor base de datos colaborativa y gamificada de WC reales.">
  <title>WC HUNTER — Encuentra, Valora, Caza</title>

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚽</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hunter: {
              bg: '#0b0f19',
              card: '#151d2f',
              cardHover: '#1e293b',
              gold: '#f59e0b',
              clean: '#10b981',
              panic: '#f43f5e',
              secret: '#a855f7'
            }
          }
        }
      }
    }
  </script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-950 select-none">

  <!-- Shell principal de la aplicación móvil -->
  <div id="app-shell" class="relative">
    
    <!-- Contenedor de Notificaciones Toast -->
    <div id="toast-container"></div>

    <!-- Contenedor de la Vista Activa -->
    <main id="view-container" class="w-full h-full flex-1 relative"></main>

    <!-- Contenedor del Modal Ficha WC -->
    <div id="modal-container"></div>

    <!-- Contenedor del Modal Añadir WC -->
    <div id="add-modal-container"></div>

    <!-- Barra de Navegación Inferior (5 Pestañas Fundamentales) -->
    <nav id="bottom-nav">
      <button class="nav-tab-btn active" data-tab="map" title="Mapa de WC">
        <span class="nav-icon">🗺️</span>
        <span>MAPA</span>
      </button>

      <button class="nav-tab-btn" data-tab="near" title="WC Cercanos y Emergencia">
        <span class="nav-icon">📍</span>
        <span>CERCA</span>
      </button>

      <button class="nav-tab-btn" data-tab="rankings" title="Rankings de la Comunidad">
        <span class="nav-icon">🏆</span>
        <span>RANKING</span>
      </button>

      <button class="nav-tab-btn" data-tab="hunter" title="Misiones, Colección y Logros">
        <span class="nav-icon">💩</span>
        <span>HUNTER</span>
      </button>

      <button class="nav-tab-btn" data-tab="profile" title="Tu Perfil y Título">
        <span class="nav-icon">👤</span>
        <span>PERFIL</span>
      </button>
    </nav>
  </div>

  <!-- Orquestador Modular JS -->
  <script type="module" src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW register skipped:', err));
      });
    }
  </script>
</body>
</html>
