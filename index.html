<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <meta name="description" content="WC Hunter — No busques un WC. Busca un WC que quieras usar. La mayor base de datos colaborativa y gamificada de WC reales.">
  <title>WC HUNTER — Encuentra, Valora, Caza</title>

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚽</text></svg>">

  <script>
    // Service Worker (network-first: siempre intenta la red y solo usa caché sin conexión)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
  </script>

  <!-- Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#0b1326',
              dim: '#060e20',
              container: '#131b2e',
              'container-low': '#131b2e',
              'container-high': '#222a3d',
              'container-highest': '#2d3449'
            },
            primary: {
              DEFAULT: '#10b981',
              hover: '#059669',
              light: '#4edea3',
              glow: 'rgba(16, 185, 129, 0.4)'
            },
            secondary: {
              DEFAULT: '#06b6d4',
              hover: '#0891b2',
              glow: 'rgba(6, 182, 212, 0.4)'
            },
            accent: {
              amber: '#f59e0b',
              red: '#ef4444',
              purple: '#a855f7'
            },
            hunter: {
              app: '#0b1326',
              sidebar: '#060e20',
              surface: '#131b2e',
              gold: '#f59e0b',
              clean: '#10b981',
              cyan: '#06b6d4',
              panic: '#ef4444',
              secret: '#a855f7'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Leaflet Map CSS & JS (con fallback redundante cdnjs) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (!window.L) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>');
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css?v=5.0">
</head>
<body class="bg-slate-950">

  <!-- Layout Principal Adaptativo (Desktop Dual-Pane + Mobile Fullscreen) -->
  <div id="app-layout">
    
    <!-- Sidebar para Escritorio (Oculta en móvil) -->
    <aside id="desktop-sidebar">
      <!-- Logo y Marca -->
      <div class="mb-6 flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-amber-500/20 border-2 border-amber-500 flex items-center justify-center text-2xl shadow-lg shadow-amber-500/20">
          🚽
        </div>
        <div>
          <h1 class="text-base font-black text-white tracking-wider leading-none">WC HUNTER</h1>
          <p class="text-[11px] text-amber-400 font-bold mt-1">V2.0 Explorer</p>
        </div>
      </div>

      <!-- Tagline -->
      <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 mb-6">
        <p class="text-xs text-slate-300 font-semibold leading-snug">
          "No busques un WC. Busca un WC que quieras usar."
        </p>
      </div>

      <!-- Enlaces de Navegación Lateral -->
      <nav class="flex flex-col gap-1.5 flex-1">
        <button class="sidebar-link active" data-tab="map">
          <span class="text-xl">🗺️</span>
          <span>Mapa Exploratorio</span>
        </button>

        <!-- Botón de Emergencia Destacado en el Sidebar -->
        <button class="sidebar-link sidebar-panic-link" data-tab="near">
          <span class="text-xl animate-pulse">🚨</span>
          <span class="tracking-wide">NECESITO WC AHORA</span>
        </button>

        <button class="sidebar-link" data-tab="rankings">
          <span class="text-xl">🏆</span>
          <span>Rankings Top</span>
        </button>

        <button class="sidebar-link" data-tab="hunter">
          <span class="text-xl">💩</span>
          <span>Hunter & Colección</span>
        </button>

        <button class="sidebar-link" data-tab="profile">
          <span class="text-xl">👤</span>
          <span>Mi Perfil & Récords</span>
        </button>
      </nav>

      <!-- Botón de Añadir WC en Sidebar -->
      <div class="pt-4 border-t border-slate-800/80 flex flex-col gap-3">
        <button id="sidebar-add-wc-btn" class="w-full bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-600 hover:to-yellow-500 text-slate-950 font-black text-xs py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 active:scale-95">
          <span>➕</span>
          <span>Descubrir Nuevo WC</span>
        </button>

        <!-- Mini-Widget del Usuario Hunter -->
        <div id="sidebar-user-card" class="bg-slate-900/90 rounded-2xl p-3 border border-slate-800 flex items-center justify-between cursor-pointer hover:border-slate-700 transition">
          <div class="flex items-center gap-2.5">
            <span class="text-2xl" id="sidebar-avatar">🧔‍♂️</span>
            <div class="min-w-0">
              <h4 class="text-xs font-black text-white truncate" id="sidebar-username">PolM</h4>
              <p class="text-[10px] text-amber-400 font-bold truncate" id="sidebar-title">Duque del Retrete</p>
            </div>
          </div>
          <span class="text-xs font-black text-orange-400 flex items-center gap-1 bg-orange-950/40 px-2 py-1 rounded-lg border border-orange-500/30" id="sidebar-streak">
            🔥 7d
          </span>
        </div>
      </div>
    </aside>

    <!-- Viewport Principal de Contenido -->
    <div id="main-viewport">
      
      <!-- Contenedor de Notificaciones Toast -->
      <div id="toast-container"></div>

      <!-- Contenedor Dinámico de la Vista Activa -->
      <main id="view-container"></main>

      <!-- Modal Ficha de WC Completa -->
      <div id="modal-container"></div>

      <!-- Modal Formulario Añadir WC -->
      <div id="add-modal-container"></div>

      <!-- Barra de Navegación Inferior Móvil (Dock) con Pestaña de Emergencia Resaltada -->
      <nav id="bottom-nav">
        <button class="nav-tab-btn active" data-tab="map" title="Mapa">
          <span class="nav-icon">🗺️</span>
          <span>MAPA</span>
        </button>

        <!-- Botón de Emergencia Destacado en el Dock Móvil -->
        <button class="nav-tab-btn nav-tab-panic" data-tab="near" title="Emergencia">
          <span class="nav-icon">🚨</span>
          <span>URGENCIA</span>
        </button>

        <button class="nav-tab-btn" data-tab="rankings" title="Rankings">
          <span class="nav-icon">🏆</span>
          <span>RANKING</span>
        </button>

        <button class="nav-tab-btn" data-tab="hunter" title="Hunter">
          <span class="nav-icon">💩</span>
          <span>HUNTER</span>
        </button>

        <button class="nav-tab-btn" data-tab="profile" title="Perfil">
          <span class="nav-icon">👤</span>
          <span>PERFIL</span>
        </button>
      </nav>

    </div>
  </div>

  <!-- Orquestador Modular JS -->
  <script type="module" src="js/app.js?v=5.0"></script>

  <script>
    // Captura global de errores con mensaje claro si ocurre algún fallo
    window.addEventListener('error', (e) => {
      console.error('WC Hunter Runtime Error:', e.error || e.message);
    });
  </script>
</body>
</html>
